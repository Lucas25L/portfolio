<section id="stack" class="section">

    <div class="container">

        <!-- Encabezado -->

        <header class="stack__header">

            <h2 class="stack__title">
                Stack
            </h2>

            <p class="stack__description">
                Tecnologías con las que desarrollo actualmente.
            </p>

        </header>

        <!-- Categorías -->

        <div class="stack__grid">

            @for (category of stack; track category.title) {

                <article class="stack__card">

                    <h3 class="stack__card-title">
                        {{ category.title }}
                    </h3>

                    <div class="stack__icons">

                        @for (item of category.items; track item.name) {

                            <img
                                class="stack__icon"
                                [src]="item.icon"
                                [alt]="item.name"
                                [title]="item.name"
                                loading="lazy"
                                draggable="false">

                        }

                    </div>

                </article>

            }
        </div>

    </div>

</section>
